# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, or use
# the `include` property for finer control, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Dongle setup: the Makerdiary nRF52840-MDK USB dongle acts as the BLE
  # central, so both keyboard halves build as split peripherals.
  - board: nice_nano//zmk
    shield: lily58_left nice_view_adapter nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano//zmk
    shield: lily58_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nrf52840_mdk_dongle
    shield: lily58_dongle
  # Flash these on the halves (and dongle, if it ever had ZMK firmware)
  # FIRST to clear the old left<->right bonding before dongling.
  - board: nice_nano//zmk
    shield: settings_reset
  - board: nrf52840_mdk_dongle
    shield: settings_reset
